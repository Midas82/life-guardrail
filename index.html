<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
    <title>Life Guardrail | Midas Digital Sou/.utions™</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="icon" type="image/png" href="icon-512.png">
    <style>
        :root {
            --color-gold: #FFD700;
            /* Default Accent */
            --color-gold-dim: #DAA520;
            --color-accent-2: #00FFFF;
            /* Cyan */
            --color-accent-3: #FF00FF;
            /* Magenta */
            --color-accent-4: #32CD32;
            /* Lime */
            --color-accent-5: #9370DB;
            /* Purple */
            --color-black: #000000;
            --color-grey-dark: #1a1a1a;
            --color-grey-med: #808080;
            --color-grey-light: #CCCCCC;
            --color-white: #FFFFFF;
            --font-mono: 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--color-black);
            color: var(--color-white);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- UTILS --- */
        .hidden {
            display: none !important;
        }

        .gold-text {
            color: var(--color-gold);
        }

        .mono-text {
            font-family: var(--font-mono);
        }

        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-reset {
            border: none;
            background: none;
            cursor: pointer;
            color: inherit;
        }

        /* --- HEADER --- */
        header {
            padding: 15px 20px;
            border-bottom: 2px solid var(--color-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #111, #000);
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--color-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        #clock {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* --- MAIN AREA --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        .empty-state {
            text-align: center;
            margin-top: 100px;
            color: var(--color-grey-med);
        }

        /* --- ALARM GRID --- */
        .alarm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding-bottom: 80px;
            /* Space for FAB */
        }

        .alarm-card {
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid var(--color-grey-med);
            border-left: 4px solid var(--color-grey-med);
            border-radius: 8px;
            padding: 15px;
            position: relative;
            transition: all 0.2s ease;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
        }

        .alarm-card.active {
            border-left-color: var(--color-gold);
            background: rgba(40, 40, 40, 0.8);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .alarm-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--color-white);
        }

        .alarm-details {
            font-size: 0.85rem;
            color: var(--color-grey-light);
            margin-top: 5px;
        }

        .alarm-next {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--color-gold);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .alarm-controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }

        .icon-btn {
            font-size: 1.2rem;
            padding: 5px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .icon-btn:hover {
            opacity: 1;
            color: var(--color-gold);
        }

        .toggle-switch {
            position: relative;
            width: 40px;
            height: 20px;
        }

        .toggle-input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--color-grey-med);
            transition: .4s;
            border-radius: 20px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        .toggle-input:checked+.toggle-slider {
            background-color: var(--color-gold);
        }

        .toggle-input:checked+.toggle-slider:before {
            transform: translateX(20px);
        }

        /* --- COUNTDOWN BAR --- */
        .countdown-bar-bg {
            height: 4px;
            background: #333;
            margin-top: 8px;
            border-radius: 2px;
            overflow: hidden;
        }

        .countdown-bar-fill {
            height: 100%;
            background: var(--color-gold);
            width: 0%;
            transition: width 1s linear;
        }

        /* --- SUB-CARD --- */
        .sub-time {
            color: var(--color-gold-dim);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            letter-spacing: -0.5px;
        }

        /* --- ADD BUTTON (FAB) --- */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dim));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            font-size: 2rem;
            color: black;
            font-weight: bold;
            z-index: 100;
            transition: transform 0.2s;
        }

        .fab:active {
            transform: scale(0.9);
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            /* Mobile bottom sheet style */
        }

        @media(min-width: 768px) {
            .modal-overlay {
                align-items: center;
            }
        }

        .modal-content {
            background: #111;
            width: 100%;
            max-width: 500px;
            border-top: 2px solid var(--color-gold);
            border-radius: 15px 15px 0 0;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @media(min-width: 768px) {
            .modal-content {
                border-radius: 10px;
                border: 1px solid var(--color-gold);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        #close-modal {
            color: var(--color-grey-med);
        }

        .modal-title {
            color: var(--color-gold);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            color: var(--color-grey-light);
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1rem;
        }

        .form-input:focus {
            border-color: var(--color-gold);
            outline: none;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .btn-primary {
            background: var(--color-gold);
            color: black;
        }

        .btn-secondary {
            background: #333;
            color: white;
        }

        /* --- FILE UPLOAD --- */
        .file-upload-btn {
            border: 1px dashed var(--color-gold-dim);
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--color-gold-dim);
            cursor: pointer;
            border-radius: 5px;
            margin-top: 5px;
        }

        .file-upload-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        /* --- NOTIFICATION TOAST --- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-gold);
            color: black;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* --- ALARM TRIGGERED OVERLAY --- */
        #alarm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .pulse {
            animation: pulseAnim 1.5s infinite;
        }

        @keyframes pulseAnim {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7);
            }

            70% {
                box-shadow: 0 0 0 30px rgba(255, 215, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0);
            }
        }

        .alarm-msg {
            font-size: 2rem;
            color: var(--color-gold);
            margin-bottom: 20px;
            max-width: 80%;
        }

        .dismiss-btn {
            background: var(--color-gold);
            color: black;
            padding: 20px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px var(--color-gold);
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .text-lg {
            font-size: 1.2rem;
        }

        .wakelock-active {
            color: var(--color-gold) !important;
            text-shadow: 0 0 10px var(--color-gold);
        }

        .empty-hint {
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .preview-btn {
            padding: 8px 12px;
            font-size: 1.2rem;
            margin-left: 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .preview-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .sound-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sound-row select {
            flex: 1;
        }

        .time-row {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .week-row {
            display: flex;
            justify-content: space-between;
        }

        .cycle-row {
            display: flex;
            gap: 10px;
        }

        .mt-10 {
            margin-top: 10px;
        }

        .file-name {
            font-size: 0.8rem;
            color: var(--color-gold);
            margin-top: 5px;
        }

        .toggle-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 10px;
            border-radius: 5px;
        }

        .m-0 {
            margin: 0;
        }

        .btn-delete {
            width: 100%;
            color: red;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .pulse-ring {
            width: 200px;
            height: 200px;
            background: transparent;
            box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.5);
            pointer-events: none;
            position: absolute;
        }

        .btn-snooze {
            color: white;
            margin-top: 30px;
            text-decoration: underline;
        }

        /* --- MENU BUTTON --- */
        .menu-btn {
            position: relative;
        }

        .menu-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #111;
            border: 1px solid var(--color-gold);
            border-radius: 5px;
            min-width: 180px;
            z-index: 150;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            margin-top: 5px;
        }

        .menu-dropdown.hidden {
            display: none;
        }

        .menu-item {
            display: block;
            width: 100%;
            padding: 12px 15px;
            background: none;
            border: none;
            color: var(--color-white);
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: rgba(255, 215, 0, 0.1);
            color: var(--color-gold);
        }

        .menu-item:first-child {
            border-radius: 4px 4px 0 0;
        }

        .menu-item:last-child {
            border-radius: 0 0 4px 4px;
        }

        #import-file {
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Life Guardrail</h1>
        <div class="header-right">
            <button class="btn-reset text-lg" id="status-btn" aria-label="Connection Status"
                title="Online">📡</button>
            <button class="btn-reset text-lg" id="wakelock-btn" aria-label="Keep Screen On"
                title="Keep Screen On">🔆</button>
            <button class="btn-reset text-lg" id="theme-btn" aria-label="Change Accent">🎨</button>
            <div class="menu-btn" style="position: relative;">
                <button class="btn-reset text-lg" id="menu-btn" aria-label="Menu">⋮</button>
                <div id="menu-dropdown" class="menu-dropdown hidden">
                    <button class="menu-item" id="export-btn">📥 Export Alarms</button>
                    <button class="menu-item" id="import-btn">📤 Import Alarms</button>
                </div>
            </div>
            <div id="clock" class="mono-text gold-text">12:00:00</div>
        </div>
    </header>

    <main id="app">
        <div id="alarm-list" class="alarm-grid">
            <!-- Alarms injected here -->
        </div>
        <div id="empty-state" class="empty-state hidden">
            <p>No Guardrails Set.</p>
            <p class="empty-hint">Click + to fortify your schedule.</p>
        </div>
    </main>

    <button class="btn-reset fab" id="add-btn" aria-label="Add Alarm">+</button>

    <!-- EDIT/ADD MODAL -->
    <div id="modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">New Guardrail</div>
                <button class="btn-reset" id="close-modal">✕</button>
            </div>

            <form id="alarm-form">
                <input type="hidden" id="edit-id">

                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" id="inp-title" class="form-input" placeholder="e.g. Deep Work" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Recurrence Type</label>
                    <select id="inp-type" class="form-select" onchange="toggleTypeFields()"
                        aria-label="Recurrence Type">
                        <option value="fixed">Fixed Daily Time</option>
                        <option value="interval">Recurring Interval</option>
                        <option value="weekly">Weekly Custom</option>
                        <option value="cyclic">Cyclic (Work/Rest)</option>
                        <option value="annual">Annual Event</option>
                    </select>
                </div>

                <!-- Type: Fixed -->
                <div id="field-fixed" class="form-group">
                    <label class="form-label">Time (24h)</label>
                    <input type="time" id="inp-time" class="form-input" aria-label="Fixed Time">
                </div>

                <!-- Type: Interval -->
                <div id="field-interval" class="form-group hidden">
                    <label class="form-label">Start Time</label>
                    <input type="time" id="inp-interval-start-time" class="form-input" aria-label="Interval Start Time">
                    <p style="font-size: 0.8rem; color: #999; margin-top: 5px;">When should the interval start?</p>

                    <label class="form-label" style="margin-top: 15px;">Repeat Every</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="inp-interval-value" class="form-input" min="1" placeholder="45" aria-label="Interval Value" style="flex: 1;">
                        <select id="inp-interval-unit" class="form-select" aria-label="Interval Unit" style="flex: 1; min-width: 100px;">
                            <option value="minutes">Minutes</option>
                            <option value="hours">Hours</option>
                            <option value="days">Days</option>
                            <option value="months">Months</option>
                            <option value="year">Once a Year</option>
                        </select>
                    </div>
                    <p style="font-size: 0.8rem; color: #999; margin-top: 5px;">Example: Every 45 minutes, Every 2 hours, Every 3 days</p>
                </div>

                <!-- Type: Weekly -->
                <div id="field-weekly" class="form-group hidden">
                    <label class="form-label">Days & Time</label>
                    <div class="time-row">
                        <input type="time" id="inp-weekly-time" class="form-input" aria-label="Weekly Time">
                    </div>
                    <div class="week-row">
                        <label><input type="checkbox" name="day" value="1"> Mon</label>
                        <label><input type="checkbox" name="day" value="2"> Tue</label>
                        <label><input type="checkbox" name="day" value="3"> Wed</label>
                        <label><input type="checkbox" name="day" value="4"> Thu</label>
                        <label><input type="checkbox" name="day" value="5"> Fri</label>
                    </div>
                </div>

                <!-- Type: Cyclic -->
                <div id="field-cyclic" class="form-group hidden">
                    <label class="form-label">Work/Rest Cycle (Days)</label>
                    <div class="cycle-row">
                        <input type="number" id="inp-cycle-work" class="form-input" placeholder="Work (4)" min="1"
                            aria-label="Work Days">
                        <input type="number" id="inp-cycle-rest" class="form-input" placeholder="Rest (2)" min="1"
                            aria-label="Rest Days">
                    </div>
                    <label class="form-label mt-10">Cycle Start Date</label>
                    <input type="date" id="inp-cycle-start" class="form-input" aria-label="Cycle Start Date">
                    <label class="form-label mt-10">Trigger Time (on work days)</label>
                    <input type="time" id="inp-cycle-time" class="form-input" aria-label="Cycle Trigger Time">
                </div>

                <!-- Type: Annual -->
                <div id="field-annual" class="form-group hidden">
                    <label class="form-label">Date (No Year)</label>
                    <input type="date" id="inp-annual-date" class="form-input" aria-label="Annual Date">
                    <label class="form-label mt-10">Time</label>
                    <input type="time" id="inp-annual-time" class="form-input" aria-label="Annual Time">
                </div>

                <div class="form-group">
                    <label class="form-label">Snooze Duration (Minutes)</label>
                    <input type="number" id="inp-snooze" class="form-input" min="1" max="120" value="10" placeholder="10" aria-label="Snooze Duration">
                </div>

                <div class="form-group">
                    <label class="form-label">Sound</label>
                    <div class="sound-row">
                        <select id="inp-sound" class="form-select" aria-label="Select Sound">
                            <option value="default">System Beep</option>
                            <option value="synth_cyberpunk">Synth: Cyberpunk Glitch</option>
                            <option value="synth_zen">Synth: Zen Gong</option>
                            <option value="synth_industrial">Synth: Industrial Clank</option>
                            <option value="synth_digital">Synth: Digital Alarm</option>
                            <option value="synth_sonar">Synth: Sonar Ping</option>
                            <option value="synth_klaxon">Synth: Alert Klaxon</option>
                            <option value="synth_chiptune">Synth: Chiptune Arp</option>
                            <option value="synth_pulse">Synth: Pulse Drone</option>
                            <option value="synth_metalchime">Synth: Metal Chime</option>
                            <option value="synth_synthstab">Synth: Synth Stab</option>
                            <option value="synth_heavy_industrial">Synth: Heavy Industrial</option>
                            <option value="synth_cosmic_void">Synth: Cosmic Void</option>
                            <option value="synth_emergency_broadcast">Synth: Emergency Broadcast</option>
                            <option value="synth_cyber_alert">Synth: Cyber Alert</option>
                            <option value="synth_data_stream">Synth: Data Stream</option>
                            <option value="synth_air_raid">⚠️ Air Raid Siren</option>
                            <option value="synth_ships_bell">⚓ Ship's Bell</option>
                            <option value="synth_police_klaxon">🚨 Police Klaxon</option>
                            <option value="synth_tornado">🌪️ Tornado Warning</option>
                            <option value="synth_nuclear">☢️ Nuclear Alert</option>
                            <option value="custom">Custom Upload...</option>
                        </select>
                        <button type="button" id="preview-sound-btn" class="btn-reset preview-btn"
                            aria-label="Preview Sound">🔊</button>
                    </div>
                    <div id="upload-container" class="hidden">
                        <input type="file" id="inp-file" accept="audio/*" class="hidden">
                        <div class="file-upload-btn" onclick="document.getElementById('inp-file').click()">
                            📂 Choose Audio File
                        </div>
                        <div id="file-name" class="file-name"></div>
                    </div>
                </div>

                <div class="form-group toggle-group">
                    <label class="form-label m-0">Show Countdown Bar?</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="inp-countdown" class="toggle-input" aria-label="Toggle Countdown">
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="btn-row">
                    <button type="button" class="btn-reset btn btn-secondary" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn-reset btn btn-primary">Save Guardrail</button>
                </div>
                <button type="button" id="delete-btn" class="btn-reset hidden btn-delete">Delete Alarm</button>
            </form>
        </div>
    </div>

    <!-- TRIGGER OVERLAY -->
    <div id="alarm-overlay" class="hidden">
        <div id="trigger-pulse" class="dismiss-btn pulse pulse-ring">
        </div>
        <div class="alarm-msg" id="trigger-msg">WAKE UP</div>
        <button class="dismiss-btn" onclick="app.dismissAlarm()">DISMISS</button>
        <button class="btn-reset btn-snooze" onclick="app.snoozeAlarm()">Snooze 10m</button>
    </div>

    <div id="toast" class="toast">Saved.</div>

    <input type="file" id="import-file" accept=".json" style="display:none;">

    <script>
        /**
         * LIFE GUARDRAIL ENGINE
         * Architecture:
         * - IndexedDB: Stores custom audio blobs.
         * - LocalStorage: Stores alarm configurations (metadata).
         * - App Class: Main logic controller.
         */

        // --- Audio Constants ---
        const BEEP_B64 = "data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU";

        // --- Reliability Manager: Notifications, Vibration, Wake Lock ---
        class ReliabilityManager {
            constructor() {
                this.wakeLock = null;
                this.wakeLockEnabled = false;
                this.notificationPermission = Notification.permission;
                this.vibrationInterval = null;
            }

            async requestNotificationPermission() {
                if ('Notification' in window && Notification.permission === 'default') {
                    this.notificationPermission = await Notification.requestPermission();
                }
                return this.notificationPermission;
            }

            showNotification(title, options = {}) {
                if ('Notification' in window && Notification.permission === 'granted') {
                    const notification = new Notification(title, {
                        body: options.body || 'Alarm triggered!',
                        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23000" width="100" height="100"/><text y="70" x="50" text-anchor="middle" font-size="60" fill="%23FFD700">⚡</text></svg>',
                        tag: 'guardrail-alarm',
                        requireInteraction: true,
                        vibrate: [500, 200, 500]
                    });
                    notification.onclick = () => {
                        window.focus();
                        notification.close();
                    };
                    return notification;
                }
                return null;
            }

            startVibration() {
                if ('vibrate' in navigator) {
                    // Stop any existing vibration first to prevent overlap
                    this.stopVibration();
                    // Long pattern: buzz-pause-buzz-pause-buzz-pause-long buzz
                    const pattern = [500, 200, 500, 200, 500, 200, 1000, 500];
                    navigator.vibrate(pattern);
                    // Repeat vibration
                    this.vibrationInterval = setInterval(() => {
                        navigator.vibrate(pattern);
                    }, 4000);
                }
            }

            stopVibration() {
                if (this.vibrationInterval) {
                    clearInterval(this.vibrationInterval);
                    this.vibrationInterval = null;
                }
                if ('vibrate' in navigator) {
                    navigator.vibrate(0); // Stop any ongoing vibration
                }
            }

            async toggleWakeLock() {
                if (this.wakeLock) {
                    await this.releaseWakeLock();
                    return false;
                } else {
                    return await this.requestWakeLock();
                }
            }

            async requestWakeLock() {
                if ('wakeLock' in navigator) {
                    try {
                        this.wakeLock = await navigator.wakeLock.request('screen');
                        this.wakeLockEnabled = true;
                        this.wakeLock.addEventListener('release', () => {
                            this.wakeLock = null;
                            this.wakeLockEnabled = false;
                            this.updateWakeLockUI();
                        });
                        this.updateWakeLockUI();
                        return true;
                    } catch (err) {
                        console.warn('Wake Lock failed:', err);
                        return false;
                    }
                }
                return false;
            }

            async releaseWakeLock() {
                if (this.wakeLock) {
                    await this.wakeLock.release();
                    this.wakeLock = null;
                    this.wakeLockEnabled = false;
                    this.updateWakeLockUI();
                }
            }

            updateWakeLockUI() {
                const btn = document.getElementById('wakelock-btn');
                if (btn) {
                    btn.classList.toggle('wakelock-active', this.wakeLockEnabled);
                    btn.title = this.wakeLockEnabled ? 'Screen will stay on' : 'Keep Screen On';
                }
            }

            // Re-acquire wake lock when page becomes visible again
            async handleVisibilityChange() {
                if (document.visibilityState === 'visible' && this.wakeLockEnabled && !this.wakeLock) {
                    await this.requestWakeLock();
                }
            }
        }

        class Database {
            constructor() {
                this.dbName = 'GuardrailAudioDB';
                this.dbVersion = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);
                    request.onerror = (e) => reject(e);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('sounds')) {
                            db.createObjectStore('sounds', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve(this.db);
                    };
                });
            }

            async saveSound(id, blob) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    try {
                        const tx = this.db.transaction(['sounds'], 'readwrite');
                        const store = tx.objectStore('sounds');
                        store.put({ id: id, blob: blob });
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => {
                            const errorMsg = e.target.error?.name === 'QuotaExceededError'
                                ? 'Storage quota exceeded. Audio file too large.'
                                : `Failed to save sound: ${e.target.error}`;
                            reject(new Error(errorMsg));
                        };
                    } catch (e) {
                        reject(new Error(`Error saving sound: ${e.message}`));
                    }
                });
            }

            async getSound(id) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(['sounds'], 'readonly');
                    const store = tx.objectStore('sounds');
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                    req.onerror = () => reject(new Error(`Failed to retrieve sound ${id}: ${req.error}`));
                });
            }
        }

        /**
         * @typedef {Object} Alarm
         * @property {number} id - Unique identifier (timestamp)
         * @property {string} title - User-friendly name
         * @property {string} type - Alarm type: 'fixed'|'interval'|'weekly'|'cyclic'|'annual'
         * @property {boolean} active - Whether alarm is enabled
         * @property {string} [time] - HH:MM format for fixed/weekly/annual
         * @property {number} [intervalMins] - Interval for recurring alarms
         * @property {string[]} [days] - Days for weekly alarms (1-7)
         * @property {number} [cycleWork] - Work days for cyclic
         * @property {number} [cycleRest] - Rest days for cyclic
         * @property {string} [cycleStart] - YYYY-MM-DD start date for cyclic
         * @property {string} [cycleTime] - HH:MM trigger time for cyclic
         * @property {string} [annualDate] - MM-DD for annual events
         * @property {string} soundId - Sound to play
         * @property {boolean} showCountdown - Whether to show countdown bar
         * @property {number} [snoozeMins] - Snooze duration in minutes
         * @property {string} created - ISO datetime when created
         * @property {string} [lastTrigger] - ISO datetime of last trigger
         * @property {number} [snoozeUntil] - Milliseconds timestamp until snooze expires
         */

        class App {
            constructor() {
                /** @type {Alarm[]} */
                this.alarms = JSON.parse(localStorage.getItem('guardrail_alarms')) || [];
                /** @type {Database} */
                this.db = new Database();
                /** @type {ReliabilityManager} */
                this.reliability = new ReliabilityManager();
                /** @type {Audio|{stop:Function}|null} */
                this.activeAudio = null;
                /** @type {Alarm|null} */
                this.triggeredAlarm = null;
                /** @type {Date} */
                this.now = new Date();
                /** @type {string[]} */
                this.accents = ['#FFD700', '#00FFFF', '#FF00FF', '#32CD32', '#9370DB'];
                /** @type {number} */
                this.currentAccentIdx = parseInt(localStorage.getItem('guardrail_accent')) || 0;

                // Init
                this.applyAccent();
                this.db.init();
                this.render();
                this.tick();

                // CRITICAL FIX: Request notification permission immediately on load
                setTimeout(() => this.reliability.requestNotificationPermission(), 500);

                // Unlock Audio for Mobile on first interaction (required by browser policy)
                ['click', 'touchstart', 'keydown'].forEach(evt => {
                    document.addEventListener(evt, () => {
                        if (app.synth) {
                            if (!app.synth.ctx) app.synth.init();
                            if (app.synth.ctx.state === 'suspended') {
                                app.synth.ctx.resume();
                            }
                        }
                    }, { once: true });
                });

                // Re-acquire wake lock when page becomes visible
                document.addEventListener('visibilitychange', () => {
                    this.reliability.handleVisibilityChange();
                });

                // Online/offline status
                this.updateOnlineStatus();
                window.addEventListener('online', () => this.updateOnlineStatus());
                window.addEventListener('offline', () => this.updateOnlineStatus());

                // Timer
                setInterval(() => this.tick(), 1000);
            }

            updateOnlineStatus() {
                const statusBtn = document.getElementById('status-btn');
                if (navigator.onLine) {
                    statusBtn.textContent = '📡';
                    statusBtn.title = 'Online - App is connected';
                    statusBtn.style.opacity = '1';
                } else {
                    statusBtn.textContent = '📡💤';
                    statusBtn.title = 'Offline - App working from cache';
                    statusBtn.style.opacity = '0.6';
                }
            }

            tick() {
                this.now = new Date();
                this.updateClock();
                this.checkAlarms();
                // Update countdowns periodically (every tick might be heavy for DOM, but ok for < 50 alarms)
                this.updateCountdowns();
            }

            updateClock() {
                document.getElementById('clock').textContent = this.now.toLocaleTimeString('en-US', { hour12: false });
            }

            save() {
                localStorage.setItem('guardrail_alarms', JSON.stringify(this.alarms));
                this.render();
            }

            toggleAccent() {
                this.currentAccentIdx = (this.currentAccentIdx + 1) % this.accents.length;
                localStorage.setItem('guardrail_accent', this.currentAccentIdx);
                this.applyAccent();
                this.showToast('Accent Updated');
            }

            applyAccent() {
                const color = this.accents[this.currentAccentIdx];
                document.documentElement.style.setProperty('--color-gold', color);
                // Dim version approximation (just sharing same color or slight opacity for simplicity in portable app)
                document.documentElement.style.setProperty('--color-gold-dim', color);
            }

            // --- LOGIC ---

            /**
             * Calculates the next JS Date object for an alarm trigger.
             * @param {Alarm} alarm - The alarm to calculate next trigger for
             * @param {boolean} [includeGracePeriod=false] - If true, allows time up to 60s in past (grace window)
             * @returns {Date|null} - Next trigger time, or null if alarm has no valid next trigger
             */
            getNextTrigger(alarm, includeGracePeriod = false) {
                if (!alarm.active) return null;

                // Priority: Snooze
                if (alarm.snoozeUntil) {
                    if (alarm.snoozeUntil > Date.now()) {
                        return new Date(alarm.snoozeUntil);
                    }
                    // If snooze passed, fall through to normal schedule
                }

                const now = new Date();
                let next = new Date();
                const GRACE_MS = includeGracePeriod ? 60000 : 0; // 60s lookback

                if (alarm.type === 'fixed') {
                    // HH:MM 24h format
                    const [h, m] = alarm.time.split(':').map(Number);
                    next.setHours(h, m, 0, 0);
                    // If next is older than (now - grace), push to tomorrow.
                    // If next is 14:00 and now is 14:00:05, diff is -5s.
                    // 14:00 <= 14:00:05 - 60s (13:59:05) -> FALSE. Stays 14:00.
                    if (next <= (now.getTime() - GRACE_MS)) {
                        next.setDate(next.getDate() + 1);
                    }
                }
                else if (alarm.type === 'interval') {
                    // Determine base time for calculation
                    let base;
                    if (alarm.intervalStartTime) {
                        // New format: use specified start time
                        base = new Date();
                        const [h, m] = alarm.intervalStartTime.split(':').map(Number);
                        base.setHours(h, m, 0, 0);

                        // If start time is in the past today, use that as base
                        if (base < new Date()) {
                            // Start time already passed today
                        } else {
                            // Start time is in the future today, use yesterday's time
                            base.setDate(base.getDate() - 1);
                        }
                    } else {
                        // Old format: calculate from created or lastTrigger
                        base = alarm.lastTrigger ? new Date(alarm.lastTrigger) : new Date(alarm.created);
                    }

                    // Calculate interval in milliseconds
                    let intervalMs;
                    if (alarm.intervalUnit) {
                        // New format with units
                        const value = alarm.intervalValue;
                        switch(alarm.intervalUnit) {
                            case 'minutes': intervalMs = value * 60 * 1000; break;
                            case 'hours': intervalMs = value * 60 * 60 * 1000; break;
                            case 'days': intervalMs = value * 24 * 60 * 60 * 1000; break;
                            case 'months': intervalMs = value * 30 * 24 * 60 * 60 * 1000; break;
                            case 'year': intervalMs = 365 * 24 * 60 * 60 * 1000; break;
                            default: intervalMs = alarm.intervalMins * 60 * 1000;
                        }
                    } else {
                        // Old format: intervalMins in minutes
                        intervalMs = alarm.intervalMins * 60 * 1000;
                    }

                    // Calculate next occurrence
                    let candidate = base.getTime();
                    const threshold = now.getTime() - GRACE_MS;

                    while (candidate <= threshold) {
                        candidate += intervalMs;
                    }
                    next = new Date(candidate);
                }
                else if (alarm.type === 'weekly') {
                    // ... (Simplification: applying similar grace logic to weekly is complex, 
                    // relying on standard lookahead but checking 'now' carefully)
                    
                    const [h, m] = alarm.time.split(':').map(Number);
                    next.setHours(h, m, 0, 0);

                    let safeGuard = 0;
                    while (safeGuard < 14) { 
                        const day = next.getDay(); 
                        const uiDay = day === 0 ? 7 : day;

                        // Check match. 
                        // If includeGracePeriod, we allow 'next' to be slightly in past
                        const isPastGrace = next <= (now.getTime() - GRACE_MS);

                        if (alarm.days.includes(uiDay.toString()) && !isPastGrace) {
                            break;
                        }
                        next.setDate(next.getDate() + 1);
                        next.setHours(h, m, 0, 0); 
                        safeGuard++;
                    }
                }
                // ... (Cyclic and Annual omitted for brevity, logic follows similar pattern of 'next > now - grace')
                else if (alarm.type === 'cyclic') {
                    const cycleStart = new Date(alarm.cycleStart);
                    cycleStart.setHours(0, 0, 0, 0);
                    const [h, m] = (alarm.cycleTime || '09:00').split(':').map(Number);

                    const totalCycleDays = alarm.cycleWork + alarm.cycleRest;
                    const diffDays = Math.floor((now.getTime() - cycleStart.getTime()) / (1000 * 60 * 60 * 24));
                    const cyclePosition = diffDays % totalCycleDays;

                    let daysToAdd = 0;
                    if (cyclePosition < alarm.cycleWork) {
                        // Currently in work period
                        daysToAdd = 0; // Trigger today
                    } else {
                        // Currently in rest period, wait for next work period
                        daysToAdd = totalCycleDays - cyclePosition;
                    }

                    next.setDate(now.getDate() + daysToAdd);
                    next.setHours(h, m, 0, 0);

                    // If the calculated time is in the past (within grace), push to next work period
                    if (next <= (now.getTime() - GRACE_MS)) {
                        next.setDate(next.getDate() + totalCycleDays);
                    }
                }
                else if (alarm.type === 'annual') {
                    const [year, month, day] = alarm.annualDate.split('-').map(Number);
                    const [h, m] = alarm.time.split(':').map(Number);

                    next.setFullYear(now.getFullYear(), month - 1, day);
                    next.setHours(h, m, 0, 0);

                    if (next <= (now.getTime() - GRACE_MS)) {
                        next.setFullYear(now.getFullYear() + 1);
                    }
                }

                return next;
            }

            /**
             * Checks all alarms and triggers any that are due.
             * Called every 1 second from tick().
             * @returns {void}
             */
            checkAlarms() {
                this.alarms.forEach(alarm => {
                    if (!alarm.active) return;

                    // Use grace period of 60s to find "current" trigger
                    const next = this.getNextTrigger(alarm, true);

                    if (next) {
                        const diff = this.now.getTime() - next.getTime();
                        const last = alarm.lastTrigger ? new Date(alarm.lastTrigger).getTime() : 0;

                        // Trigger if:
                        // 1. Time has passed (diff >= 0)
                        // 2. But not too long ago (diff < 60000) - i.e. within the last minute
                        // 3. Haven't triggered within last 65 seconds (prevents duplicates)
                        // 4. Last trigger was for a different cycle (check timestamp doesn't match current trigger time)

                        if (diff >= 0 && diff < 60000) {
                            const timeSinceLastTrigger = this.now.getTime() - last;
                            // Use 65s debounce but also check that we're not re-triggering the exact same time
                            const isSameInstance = last > 0 && Math.abs(next.getTime() - last) < 1000;

                            if (timeSinceLastTrigger > 65000 && !isSameInstance) {
                                this.trigger(alarm);
                            }
                        }
                    }
                });
            }

            /**
             * Triggers an alarm: shows overlay, notification, vibration, audio
             * @param {Alarm} alarm - The alarm to trigger
             * @returns {Promise<void>}
             */
            async trigger(alarm) {
                console.log('TRIGGERING', alarm.title);
                this.triggeredAlarm = alarm;
                alarm.lastTrigger = new Date().toISOString();
                delete alarm.snoozeUntil; // Clear snooze once triggered
                this.save();

                // UI - Show fullscreen overlay
                document.getElementById('trigger-msg').textContent = alarm.title;
                document.getElementById('alarm-overlay').classList.remove('hidden');

                // RELIABILITY: System notification (works in background)
                this.reliability.showNotification(alarm.title, {
                    body: 'Life Guardrail - Tap to dismiss'
                });

                // RELIABILITY: Vibration (works even with volume down)
                this.reliability.startVibration();

                // Audio
                if (alarm.soundId && alarm.soundId !== 'default' && !alarm.soundId.startsWith('synth_')) {
                    const blob = await this.db.getSound(alarm.soundId);
                    if (blob) {
                        const url = URL.createObjectURL(blob);
                        this.activeAudio = new Audio(url);
                        this.activeAudio.loop = true;
                        this.activeAudio.volume = 1.0; // Max volume
                        this.activeAudio.play().catch(e => console.warn('Audio play failed:', e));
                    } else {
                        app.synth.play('beeps');
                    }
                } else {
                    // Synth or Default
                    const type = (alarm.soundId && alarm.soundId.startsWith('synth_')) ? alarm.soundId.replace('synth_', '') : 'beeps';
                    app.synth.play(type);
                    this.activeAudio = { stop: () => app.synth.stop() };
                }
            }

            /**
             * Dismisses the currently triggered alarm, stopping all effects
             * @returns {void}
             */
            dismissAlarm() {
                // Stop audio
                if (this.activeAudio) {
                    if (this.activeAudio.stop) this.activeAudio.stop(); // WebAudio/Synth
                    else this.activeAudio.pause(); // HTML5 Audio
                }
                if (app.synth) app.synth.stop();

                // RELIABILITY: Stop vibration
                this.reliability.stopVibration();

                // Hide overlay
                document.getElementById('alarm-overlay').classList.add('hidden');
                this.triggeredAlarm = null;
            }

            /**
             * Snoozes the triggered alarm for configured duration
             * @returns {void}
             */
            snoozeAlarm() {
                if (!this.triggeredAlarm) return;

                const id = this.triggeredAlarm.id;
                const idx = this.alarms.findIndex(a => a.id === id);
                if (idx !== -1) {
                    const snoozeMins = this.alarms[idx].snoozeMins || 10;
                    this.alarms[idx].snoozeUntil = Date.now() + snoozeMins * 60 * 1000;
                    this.save();
                    this.showToast(`Snoozed ${snoozeMins}m`);
                }

                this.dismissAlarm();
            }

            // --- UI RENDERING ---

            updateCountdowns() {
                this.alarms.forEach(alarm => {
                    if (!alarm.active || !alarm.showCountdown) return;
                    const card = document.getElementById(`alarm-card-${alarm.id}`);
                    if (!card) return;

                    const next = this.getNextTrigger(alarm);
                    if (!next) return;

                    const diffMs = next.getTime() - new Date().getTime();

                    // Visual logic: determine max time window based on alarm type
                    let maxMs = 3600000; // Default 1 hour (fallback)
                    if (alarm.type === 'fixed') maxMs = 24 * 60 * 60 * 1000; // 24 hours
                    if (alarm.type === 'interval') {
                        if (alarm.intervalUnit) {
                            // New format with units
                            const value = alarm.intervalValue;
                            switch(alarm.intervalUnit) {
                                case 'minutes': maxMs = value * 60 * 1000; break;
                                case 'hours': maxMs = value * 60 * 60 * 1000; break;
                                case 'days': maxMs = value * 24 * 60 * 60 * 1000; break;
                                case 'months': maxMs = value * 30 * 24 * 60 * 60 * 1000; break;
                                case 'year': maxMs = 365 * 24 * 60 * 60 * 1000; break;
                            }
                        } else {
                            // Old format
                            maxMs = alarm.intervalMins * 60 * 1000;
                        }
                    }
                    if (alarm.type === 'weekly') maxMs = 7 * 24 * 60 * 60 * 1000; // 7 days
                    if (alarm.type === 'cyclic') maxMs = (alarm.cycleWork + alarm.cycleRest) * 24 * 60 * 60 * 1000;
                    if (alarm.type === 'annual') maxMs = 365 * 24 * 60 * 60 * 1000; // 365 days

                    const pct = Math.max(0, Math.min(100, (1 - (diffMs / maxMs)) * 100));
                    const fill = card.querySelector('.countdown-bar-fill');
                    if (fill) fill.style.width = `${pct}%`;

                    // Text update: D/H/M/S
                    const seconds = Math.floor((diffMs / 1000) % 60);
                    const minutes = Math.floor((diffMs / (1000 * 60)) % 60);
                    const hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
                    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));

                    let timeStr = '';
                    if (days > 0) timeStr += `${days}d `;
                    if (hours > 0 || days > 0) timeStr += `${hours}h `;
                    if (minutes > 0 || hours > 0 || days > 0) timeStr += `${minutes}m `;
                    timeStr += `${seconds}s`;

                    const timeSpan = card.querySelector('.sub-time');
                    if (timeSpan) timeSpan.textContent = timeStr;
                    if (timeSpan) timeSpan.style.color = 'var(--color-gold)';
                });
            }

            render() {
                const list = document.getElementById('alarm-list');
                list.innerHTML = '';

                if (this.alarms.length === 0) {
                    document.getElementById('empty-state').classList.remove('hidden');
                    return;
                } else {
                    document.getElementById('empty-state').classList.add('hidden');
                }

                this.alarms.forEach(alarm => {
                    const el = document.createElement('div');
                    el.className = `alarm-card ${alarm.active ? 'active' : ''}`;
                    el.id = `alarm-card-${alarm.id}`;

                    const next = this.getNextTrigger(alarm);
                    const timeDisplay = next ? next.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';

                    let details = '';
                    if (alarm.type === 'fixed') details = 'Daily';
                    if (alarm.type === 'interval') {
                        if (alarm.intervalUnit) {
                            // New format
                            const unitText = alarm.intervalUnit === 'year' ? 'Yearly' : `Every ${alarm.intervalValue} ${alarm.intervalUnit}`;
                            details = `${unitText} @ ${alarm.intervalStartTime}`;
                        } else {
                            // Old format
                            details = `Every ${alarm.intervalMins}m`;
                        }
                    }
                    if (alarm.type === 'weekly') details = `Weekly`;
                    if (alarm.type === 'cyclic') details = `Cycle: ${alarm.cycleWork} On / ${alarm.cycleRest} Off`;
                    if (alarm.type === 'annual') details = `Annual: ${alarm.annualDate}`;

                    el.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="alarm-name">${alarm.title}</div>
                        <div class="alarm-details">${details}</div>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" class="toggle-input" ${alarm.active ? 'checked' : ''} onchange="app.toggleAlarm(${alarm.id})">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="alarm-next">
                    <span style="font-size:1.2rem">🔔 ${timeDisplay}</span>
                    <span class="sub-time">Target</span>
                </div>

                ${alarm.showCountdown ? `
                <div class="countdown-bar-bg">
                    <div class="countdown-bar-fill"></div>
                </div>` : ''}

                <div class="alarm-controls">
                    <button class="btn-reset icon-btn" onclick="app.editAlarm(${alarm.id})">✏️</button>
                    <button class="btn-reset icon-btn" onclick="app.deleteAlarm(${alarm.id})">🗑️</button>
                </div>
            `;
                    list.appendChild(el);
                });

                this.updateCountdowns(); // Initial draw
            }

            // --- ACTIONS ---

            toggleAlarm(id) {
                const idx = this.alarms.findIndex(a => a.id === id);
                if (idx !== -1) {
                    this.alarms[idx].active = !this.alarms[idx].active;
                    this.save();
                }
            }

            deleteAlarm(id) {
                if (!confirm('Delete this guardrail?')) return;
                this.alarms = this.alarms.filter(a => a.id !== id);
                this.save();
            }

            editAlarm(id) {
                const alarm = this.alarms.find(a => a.id === id);
                if (!alarm) return;

                // Populate form
                document.getElementById('edit-id').value = alarm.id;
                document.getElementById('inp-title').value = alarm.title;
                document.getElementById('inp-type').value = alarm.type;
                document.getElementById('inp-countdown').checked = alarm.showCountdown;
                document.getElementById('inp-sound').value = alarm.soundId || 'default';
                document.getElementById('inp-snooze').value = alarm.snoozeMins || 10;

                toggleTypeFields(); // reset visibility

                if (alarm.type === 'fixed') document.getElementById('inp-time').value = alarm.time;
                if (alarm.type === 'interval') {
                    // Load new format if available, fall back to old format
                    if (alarm.intervalUnit) {
                        document.getElementById('inp-interval-value').value = alarm.intervalValue;
                        document.getElementById('inp-interval-unit').value = alarm.intervalUnit;
                        document.getElementById('inp-interval-start-time').value = alarm.intervalStartTime || '00:00';
                    } else {
                        // Backward compatibility: convert old intervalMins to hours
                        const mins = alarm.intervalMins || 0;
                        if (mins % (24 * 60) === 0) {
                            document.getElementById('inp-interval-value').value = mins / (24 * 60);
                            document.getElementById('inp-interval-unit').value = 'days';
                        } else if (mins % 60 === 0) {
                            document.getElementById('inp-interval-value').value = mins / 60;
                            document.getElementById('inp-interval-unit').value = 'hours';
                        } else {
                            document.getElementById('inp-interval-value').value = mins;
                            document.getElementById('inp-interval-unit').value = 'minutes';
                        }
                        document.getElementById('inp-interval-start-time').value = '00:00';
                    }
                }
                if (alarm.type === 'weekly') {
                    document.getElementById('inp-weekly-time').value = alarm.time;
                    document.querySelectorAll('input[name="day"]').forEach(cb => {
                        cb.checked = alarm.days.includes(cb.value);
                    });
                }
                if (alarm.type === 'cyclic') {
                    document.getElementById('inp-cycle-work').value = alarm.cycleWork;
                    document.getElementById('inp-cycle-rest').value = alarm.cycleRest;
                    document.getElementById('inp-cycle-start').value = alarm.cycleStart;
                    document.getElementById('inp-cycle-time').value = alarm.cycleTime || '09:00';
                }
                if (alarm.type === 'annual') {
                    document.getElementById('inp-annual-date').value = alarm.annualDate;
                    document.getElementById('inp-annual-time').value = alarm.time;
                }

                // Show delete button
                document.getElementById('delete-btn').classList.remove('hidden');
                document.getElementById('delete-btn').onclick = () => {
                    this.deleteAlarm(id);
                    closeModal();
                    this.showToast('Deleted');
                };

                openModal(`Edit ${alarm.title}`);
            }

            /**
             * Validates and saves form data as a new or updated alarm
             * @returns {Promise<void>}
             */
            async saveForm() {
                try {
                    console.log('Saving Form...');
                    const id = document.getElementById('edit-id').value;
                    const isNew = !id;

                    const data = {
                        id: isNew ? Date.now() : parseInt(id),
                        created: isNew ? new Date().toISOString() : undefined,
                        active: true,
                        title: document.getElementById('inp-title').value.trim(),
                        type: document.getElementById('inp-type').value,
                        showCountdown: document.getElementById('inp-countdown').checked,
                        soundId: document.getElementById('inp-sound').value,
                        snoozeMins: parseInt(document.getElementById('inp-snooze').value) || 10
                    };

                    // Validate title
                    if (!data.title) return alert('Title is required');
                    if (data.title.length > 100) return alert('Title must be less than 100 characters');

                    if (!data.created) {
                        const existing = this.alarms.find(a => a.id === parseInt(id));
                        if (existing) data.created = existing.created;
                    }

                    if (data.type === 'fixed') {
                        data.time = document.getElementById('inp-time').value;
                        if (!data.time) return alert('Time is required');
                    }
                    else if (data.type === 'interval') {
                        data.intervalValue = parseInt(document.getElementById('inp-interval-value').value);
                        data.intervalUnit = document.getElementById('inp-interval-unit').value;
                        data.intervalStartTime = document.getElementById('inp-interval-start-time').value || '00:00';

                        if (!data.intervalValue || data.intervalValue < 1) return alert('Interval value must be at least 1');
                        if (data.intervalValue > 999) return alert('Interval value cannot exceed 999');

                        // Validate based on unit
                        if (data.intervalUnit === 'year' && data.intervalValue !== 1) {
                            return alert('For "Once a Year", use 1');
                        }

                        // For backward compatibility, also set intervalMins
                        if (data.intervalUnit === 'minutes') data.intervalMins = data.intervalValue;
                        else if (data.intervalUnit === 'hours') data.intervalMins = data.intervalValue * 60;
                        else if (data.intervalUnit === 'days') data.intervalMins = data.intervalValue * 24 * 60;
                        else if (data.intervalUnit === 'months') data.intervalMins = data.intervalValue * 30 * 24 * 60;
                        else if (data.intervalUnit === 'year') data.intervalMins = 365 * 24 * 60;
                    }
                    else if (data.type === 'weekly') {
                        data.time = document.getElementById('inp-weekly-time').value;
                        data.days = Array.from(document.querySelectorAll('input[name="day"]:checked')).map(cb => cb.value);
                        if (!data.days.length) return alert('Select at least one day');
                        if (!data.time) return alert('Time is required');
                    }
                    else if (data.type === 'cyclic') {
                        data.cycleWork = parseInt(document.getElementById('inp-cycle-work').value);
                        data.cycleRest = parseInt(document.getElementById('inp-cycle-rest').value);
                        data.cycleStart = document.getElementById('inp-cycle-start').value;
                        data.cycleTime = document.getElementById('inp-cycle-time').value || '09:00';
                        if (!data.cycleWork || data.cycleWork < 1) return alert('Work days must be at least 1');
                        if (!data.cycleRest || data.cycleRest < 1) return alert('Rest days must be at least 1');
                        if (data.cycleWork > 365) return alert('Work days cannot exceed 365');
                        if (data.cycleRest > 365) return alert('Rest days cannot exceed 365');
                        if (!data.cycleStart) return alert('Cycle start date is required');
                    }
                    else if (data.type === 'annual') {
                        data.annualDate = document.getElementById('inp-annual-date').value;
                        data.time = document.getElementById('inp-annual-time').value;
                        if (!data.annualDate) return alert('Date is required');
                        if (!data.time) return alert('Time is required');
                    }

                    // Handle Audio File
                    const fileInput = document.getElementById('inp-file');
                    if (data.soundId === 'custom' && fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        const soundKey = `snh_${data.id}`;
                        await this.db.saveSound(soundKey, file);
                        data.soundId = soundKey;
                    } else if (data.soundId === 'custom' && !isNew) {
                        // Preserve existing custom sound, don't fall back to default
                        const existing = this.alarms.find(a => a.id === parseInt(id));
                        if (existing && existing.soundId && existing.soundId.startsWith('snh_')) {
                            data.soundId = existing.soundId; // Keep the existing custom sound
                        } else {
                            data.soundId = 'default'; // Only fallback if no custom sound existed
                        }
                    } else if (data.soundId === 'custom' && isNew) {
                        // New alarm with custom option but no file uploaded
                        data.soundId = 'default';
                    }

                    if (isNew) this.alarms.push(data);
                    else {
                        const idx = this.alarms.findIndex(a => a.id === parseInt(id));
                        if (idx !== -1) this.alarms[idx] = { ...this.alarms[idx], ...data };
                    }

                    this.save();
                    closeModal();
                    this.showToast(isNew ? 'Guardrail Added' : 'Updated');
                } catch (e) {
                    console.error('Save Error:', e);
                    alert('Error saving: ' + e.message);
                }
            }

            showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            }

            /**
             * Exports all alarms as a JSON file for backup
             * @returns {Promise<void>}
             */
            async exportAlarms() {
                try {
                    const backup = {
                        version: 1,
                        exportDate: new Date().toISOString(),
                        alarms: this.alarms
                    };
                    const json = JSON.stringify(backup, null, 2);
                    const blob = new Blob([json], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `life-guardrail-backup-${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    this.showToast('Alarms exported successfully');
                } catch (e) {
                    console.error('Export failed:', e);
                    alert('Export failed: ' + e.message);
                }
            }

            /**
             * Imports alarms from a JSON backup file
             * @returns {Promise<void>}
             */
            async importAlarms() {
                const fileInput = document.getElementById('import-file');
                fileInput.click();
                fileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    try {
                        const text = await file.text();
                        const backup = JSON.parse(text);

                        if (!backup.alarms || !Array.isArray(backup.alarms)) {
                            throw new Error('Invalid backup file format');
                        }

                        // Validate alarms array
                        for (const alarm of backup.alarms) {
                            if (!alarm.id || !alarm.title || !alarm.type) {
                                throw new Error('Invalid alarm format in backup');
                            }
                        }

                        // Confirm import
                        const count = backup.alarms.length;
                        if (!confirm(`Import ${count} alarm(s)? This will add to existing alarms.`)) {
                            return;
                        }

                        // Import alarms (add to existing, don't overwrite)
                        this.alarms.push(...backup.alarms);
                        this.save();
                        this.showToast(`Imported ${count} alarm(s)`);
                    } catch (e) {
                        console.error('Import failed:', e);
                        alert('Import failed: ' + e.message);
                    } finally {
                        fileInput.value = '';
                    }
                };
            }
        }

        class SoundSynthesizer {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.osc = null;
                this.interval = null;
                this.previewTimeout = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    // Master gain for maximum volume
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = 2.0; // Boost audio above normal
                    this.masterGain.connect(this.ctx.destination);
                }
            }

            stop() {
                if (this.osc) { try { this.osc.stop(); } catch (e) { } this.osc = null; }
                if (this.interval) { clearInterval(this.interval); this.interval = null; }
                if (this.previewTimeout) { clearTimeout(this.previewTimeout); this.previewTimeout = null; }
            }

            async play(type, loop = true) {
                this.init();
                this.stop();
                
                try {
                    if (this.ctx.state === 'suspended') {
                        await this.ctx.resume();
                    }
                } catch (e) {
                    console.error("Audio Context Resume Failed:", e);
                }

                const soundMap = {
                    'cyberpunk': () => this.playCyberpunk(loop),
                    'zen': () => this.playZen(loop),
                    'industrial': () => this.playIndustrial(loop),
                    'digital': () => this.playDigital(loop),
                    'sonar': () => this.playSonar(loop),
                    'klaxon': () => this.playKlaxon(loop),
                    'chiptune': () => this.playChiptune(loop),
                    'pulse': () => this.playPulse(loop),
                    'metalchime': () => this.playMetalChime(loop),
                    'synthstab': () => this.playSynthStab(loop),
                    'heavy_industrial': () => this.playHeavyIndustrial(loop),
                    'cosmic_void': () => this.playCosmicVoid(loop),
                    'emergency_broadcast': () => this.playEmergencyBroadcast(loop),
                    'cyber_alert': () => this.playCyberAlert(loop),
                    'data_stream': () => this.playDataStream(loop),
                    'air_raid': () => this.playAirRaid(loop),
                    'ships_bell': () => this.playShipsBell(loop),
                    'police_klaxon': () => this.playPoliceKlaxon(loop),
                    'tornado': () => this.playTornado(loop),
                    'nuclear': () => this.playNuclear(loop)
                };

                const playFn = soundMap[type] || (() => this.playBeeps(loop));
                playFn();
            }

            preview(type) {
                this.play(type, false);
                // Stop after 2 seconds
                this.previewTimeout = setTimeout(() => this.stop(), 2000);
            }

            createOscGain() {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.masterGain);
                return { osc, gain };
            }

            playCyberpunk(loop) {
                const playSwipe = () => {
                    const { osc, gain } = this.createOscGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(50, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.5);
                };
                playSwipe();
                if (loop) this.interval = setInterval(playSwipe, 1000);
            }

            playZen(loop) {
                const playGong = () => {
                    const { osc, gain } = this.createOscGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.6, this.ctx.currentTime + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 2.5);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 3);
                };
                playGong();
                if (loop) this.interval = setInterval(playGong, 3500);
            }

            playIndustrial(loop) {
                const playClank = () => {
                    const { osc, gain } = this.createOscGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                };
                playClank();
                if (loop) this.interval = setInterval(playClank, 500);
            }

            playDigital(loop) {
                const playBeep = () => {
                    const { osc, gain } = this.createOscGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                };
                playBeep();
                setTimeout(playBeep, 150);
                if (loop) this.interval = setInterval(() => {
                    playBeep();
                    setTimeout(playBeep, 150);
                }, 1000);
            }

            playBeeps(loop) {
                const playShot = () => {
                    const { osc, gain } = this.createOscGain();
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.type = 'triangle';
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.5);
                };
