                playShot();
                if (loop) this.interval = setInterval(playShot, 1500);
            }

            // === NEW SOUNDS ===

            playSonar(loop) {
                // Submarine ping - clean sine with quick decay
                const playPing = () => {
                    const { osc, gain } = this.createOscGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.8);
                };
                playPing();
                if (loop) this.interval = setInterval(playPing, 2000);

            playKlaxon(loop) {
                // Emergency siren - alternating high/low
                let high = true;
                const playSiren = () => {
                    const { osc, gain } = this.createOscGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(high ? 800 : 600, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime + 0.4);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.5);
                    high = !high;
                };
                playSiren();
                if (loop) this.interval = setInterval(playSiren, 500);

            playChiptune(loop) {
                // 8-bit ascending arpeggio
                const notes = [262, 330, 392, 523]; // C4, E4, G4, C5
                let noteIdx = 0;

                    const { osc, gain } = this.createOscGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(notes[noteIdx], this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                    noteIdx = (noteIdx + 1) % notes.length;

                playNote();
                if (loop) this.interval = setInterval(playNote, 150);

                // Deep pulsing drone for meditation

                    const { osc, gain } = this.createOscGain();

                const playSiren = () => {
                    const { osc, gain } = this.createOscGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 1.5);
                    osc.frequency.linearRampToValueAtTime(400, this.ctx.currentTime + 3);
                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.4, this.ctx.currentTime + 3);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 3);
                };
                playSiren();
                if (loop) this.interval = setInterval(playSiren, 3000);
            }

            playShipsBell(loop) {
                const playBell = () => {
                    // Metallic bell with overtones
                    const freqs = [880, 1320, 1760];
                    freqs.forEach((freq, i) => {
                        const { osc, gain } = this.createOscGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.3 / (i + 1), this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 2);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 2);
                    });
                };
                playBell();
                if (loop) this.interval = setInterval(playBell, 3000);
            }

            playPoliceKlaxon(loop) {
                const playKlax = () => {
                    const { osc, gain } = this.createOscGain();
                    osc.type = 'square';
                    // Fast alternating two-tone
                    const times = [0, 0.4, 0.8, 1.2];
                    const freqs = [650, 500, 650, 500];
                    times.forEach((t, i) => {
                        osc.frequency.setValueAtTime(freqs[i], this.ctx.currentTime + t);
                    });
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 1.6);
                };
                playKlax();
                if (loop) this.interval = setInterval(playKlax, 1600);
            }

            playTornado(loop) {
                const playWarning = () => {
                    // Three-tone EAS warning
                    const tones = [853, 960, 1050];
                    tones.forEach((freq, i) => {
                        setTimeout(() => {
                            const { osc, gain } = this.createOscGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                            gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                            osc.start();
                            osc.stop(this.ctx.currentTime + 0.3);
                        }, i * 100);
                    });
                };
                playWarning();
                if (loop) this.interval = setInterval(playWarning, 1200);
            }

            playNuclear(loop) {
                const playAlert = () => {
                    // Intense pulsing dual-tone
                    const pulse = () => {
                        const { osc, gain } = this.createOscGain();
                        const { osc: osc2, gain: gain2 } = this.createOscGain();
                        osc.type = 'sawtooth';
                        osc2.type = 'sawtooth';
                        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                        osc2.frequency.setValueAtTime(330, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                        gain2.gain.setValueAtTime(0.3, this.ctx.currentTime);
                        osc.start();
                        osc2.start();
                        osc.stop(this.ctx.currentTime + 0.2);
                        osc2.stop(this.ctx.currentTime + 0.2);
                    };
                    for (let i = 0; i < 5; i++) {
                        setTimeout(pulse, i * 250);
                    }
                };
                playAlert();
                if (loop) this.interval = setInterval(playAlert, 2000);
            }
        }

        // --- DOM BINDINGS ---
        const app = new App();
        app.synth = new SoundSynthesizer();
        window.app = app; // Expos for inline onclicks

        document.getElementById('add-btn').onclick = () => {
            document.getElementById('alarm-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('delete-btn').classList.add('hidden');
            toggleTypeFields();
            openModal('New Guardrail');
        };

        document.getElementById('theme-btn').onclick = () => app.toggleAccent();

        // Menu toggle
        document.getElementById('menu-btn').onclick = () => {
            const dropdown = document.getElementById('menu-dropdown');
            dropdown.classList.toggle('hidden');
        };

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('menu-btn');
            const dropdown = document.getElementById('menu-dropdown');
            if (!menu.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });

        document.getElementById('export-btn').onclick = () => {
            document.getElementById('menu-dropdown').classList.add('hidden');
            app.exportAlarms();
        };

        document.getElementById('import-btn').onclick = () => {
            document.getElementById('menu-dropdown').classList.add('hidden');
            app.importAlarms();
        };

        document.getElementById('close-modal').onclick = closeModal;
        document.getElementById('cancel-btn').onclick = closeModal;

        document.getElementById('alarm-form').onsubmit = (e) => {
            e.preventDefault();
            app.saveForm();
        };

        document.getElementById('inp-sound').onchange = (e) => {
            document.getElementById('upload-container').className = e.target.value === 'custom' ? '' : 'hidden';
        };

        document.getElementById('inp-file').onchange = (e) => {
            if (e.target.files[0]) document.getElementById('file-name').textContent = e.target.files[0].name;
        };

        // Wake Lock toggle
        document.getElementById('wakelock-btn').onclick = async () => {
            const enabled = await app.reliability.toggleWakeLock();
            app.showToast(enabled ? 'Screen will stay on' : 'Screen lock enabled');
        };

        // Sound preview button
        document.getElementById('preview-sound-btn').onclick = () => {
            const soundValue = document.getElementById('inp-sound').value;
            if (soundValue === 'custom') {
                app.showToast('Upload a file first');
                return;
            }
            const type = soundValue.startsWith('synth_') ? soundValue.replace('synth_', '') : 'beeps';
            app.synth.preview(type);
        };

        // Utils
        function openModal(title) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
        function toggleTypeFields() {
            const type = document.getElementById('inp-type').value;
            document.getElementById('field-fixed').classList.add('hidden');
            document.getElementById('field-interval').classList.add('hidden');
            document.getElementById('field-weekly').classList.add('hidden');
            document.getElementById('field-cyclic').classList.add('hidden');
            document.getElementById('field-annual').classList.add('hidden');

            document.getElementById(`field-${type}`).classList.remove('hidden');
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('SW registered:', reg.scope))
                    .catch((err) => console.log('SW registration failed:', err));
            });
        }

    </script>

</body>

</html>
